server:
  port: 8090

spring:
  application:
    name: simulation

  # ===============================
  # SECURITY (RESOURCE SERVER ONLY)
  # ===============================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth:8081

  # ===============================
  # KAFKA
  # ===============================
  kafka:
    bootstrap-servers: localhost:9092

    properties:
      schema.registry.url: http://localhost:8081
      specific.protobuf.value.type: com.dtcc.simulation.proto.TradeEventOuterClass$TradeEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer

    listener:
      ack-mode: record

  # ===============================
  # DATABASE
  # ===============================
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ===============================
# APPLICATION CONFIG
# ===============================
app:
  kafka:
    trade-topic: trade-events

  rabbitmq:
    stream:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_STREAM_PORT:5552}
      name: ${RABBITMQ_STREAM_NAME:trade-stream}

# ===============================
# DOWNSTREAM SERVICES
# ===============================
portfolio:
  service:
    url: http://pms-api-gateway:8080/simulation
